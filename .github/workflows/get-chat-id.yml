name: Get Telegram chat id
on:
  workflow_dispatch:
jobs:
  ids:
    runs-on: ubuntu-latest
    steps:
      - name: List chats the bot can see
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -sS "https://api.telegram.org/bot${TOKEN}/getUpdates" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); s={}; [s.__setitem__(str(c['id']), c.get('title') or c.get('username') or c.get('first_name')) for u in d.get('result',[]) for m in [u.get('message') or u.get('channel_post') or u.get('my_chat_member') or {}] for c in [m.get('chat')] if c]; print(s or d)"
